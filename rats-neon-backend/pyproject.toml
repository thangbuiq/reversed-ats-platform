[project]
name = "rats_neon_backend"
version = "0.1.0"
description = "LinkedIn job extraction that writes straight to Neon (PostgreSQL) (and optionally Qdrant)."
requires-python = ">=3.11, <3.13"
readme = "README.md"
dependencies = [
    # Data Processing
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "loguru>=0.7.0", # Better logging
    "tenacity>=8.2.0", # Retry logic
    "pydantic>=2.5.0",
    "pydantic-settings>=2.12.0",
    "typer>=0.12.3",
    "rich>=13.0.0",
    # JobSpy
    "python-jobspy>=1.1.82",
    # Neon (PostgreSQL)
    "psycopg[binary]>=3.2.0",
]

[project.scripts]
rats-neon-backend = "rats_neon_backend.cli:main"

[project.optional-dependencies]
vectors = [
    # Optional Qdrant sync used only by the CV matcher
    "qdrant-client>=1.17.0",
    "fastembed>=0.7.4",
]
dev = [
    "pytest>=7.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rats_neon_backend"]

[tool.hatch.build.targets.sdist]
packages = ["src/rats_neon_backend"]
